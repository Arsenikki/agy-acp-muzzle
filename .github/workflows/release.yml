name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...
        env:
          AGY_ACP_MUZZLE_REQUIRE_LANDLOCK: "1"
      - name: build
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            for cmd in agy-acp-muzzle acp-smoke; do
              GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/${cmd}-linux-${arch}" "./cmd/${cmd}"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
